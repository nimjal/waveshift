<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="s" x1="6" y1="42" x2="42" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="#0b1020"/>
  <!-- reticle ring with gaps, like the player's marker -->
  <circle cx="24" cy="24" r="13" stroke="url(#s)" stroke-width="3" stroke-dasharray="14.4 6" stroke-dashoffset="7.2" stroke-linecap="round"/>
  <!-- the mover: where it was, where it is -->
