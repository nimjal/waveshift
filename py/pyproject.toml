[project]
name = "planetx"
version = "0.1.0"
license = "MIT"
description = "Waveshift: SPHEREx sky blink pipeline"
authors = [
    { name = "Nimit Jalan", email = "127307786+nimjal@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "astropy>=8.0.2",
    "astroquery>=0.4.11",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "reproject>=0.21.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
api = [
    "fastapi>=0.162.7",
    "uvicorn[standard]>=0.54.0",
]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
]

[tool.uv]
default-groups = ["dev", "api"]
